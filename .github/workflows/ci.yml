name: test
on: [pull_request, workflow_dispatch]

env:
  # cmake/duckdb-standalone builds into <binary dir>/duckdb-install. The
  # extension build is told where that is on its own step, not here: the
  # standalone build must not see it, or it would reuse a tree it is supposed
  # to be producing.
  DUCKDB_STAGE: /home/runner/duckdb-stage

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # httpfs reaches the network through libcurl, which the shared action
      # below does not install. Needed on every run, cached DuckDB or not.
      - name: Install libcurl
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      # DuckDB takes minutes to build and changes only when the tag or the
      # reader list changes, so the key is built from exactly those two.
      - name: Read DuckDB tag and readers
        id: duckdb
        run: |
          tag=$(grep -oE 'DUCKDB_TAG "[^"]+"' cmake/DuckDB.cmake | cut -d'"' -f2)
          readers=$(grep -oE 'DUCKDB_READERS "[^"]+"' cmake/DuckDB.cmake | cut -d'"' -f2)
          test -n "$tag" && test -n "$readers"
          echo "key=duckdb-${{ runner.os }}-${tag}-${readers//;/-}" >> "$GITHUB_OUTPUT"

      - name: Restore DuckDB
        id: duckdb-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/duckdb-stage/duckdb-install
          key: ${{ steps.duckdb.outputs.key }}

      # Driven through cmake/duckdb-standalone so this uses the same recipe as
      # an ordinary build. A second copy of the recipe here is how
      # -DDISABLE_EXTENSION_LOAD=1 once ended up in CI and not in the build
      # the README documents.
      - name: Build DuckDB
        if: steps.duckdb-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cmake/duckdb-standalone -B "$DUCKDB_STAGE"
          cmake --build "$DUCKDB_STAGE" --target duckdb_build -j"$(nproc)"
          test -f "$DUCKDB_STAGE/duckdb-install/lib/libduckdb_static.a"

      # DUCKDB_PREBUILT_ROOT reaches cmake/DuckDB.cmake through the job
      # environment, because the shared action calls cmake with a fixed
      # argument list.
      - uses: villagesql/extension-actions/cpp@main
        env:
          DUCKDB_PREBUILT_ROOT: /home/runner/duckdb-stage/duckdb-install
        with:
          extension-name: vsql_duckdb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # A fixed release, so this build only changes when you change it.
          villagesql-version: "0.0.6"

      # The extension must export nothing but its two entry points, or the
      # dynamic loader can bind a DuckDB call to a mysqld definition of the
      # same third-party symbol. Data symbols count too, so this looks at
      # everything the version script left global rather than functions alone.
      - name: Check exported symbols
        run: |
          so=$(find ext-build -name 'vsql_duckdb.so' | head -1)
          test -n "$so"
          nm -D --defined-only --extern-only "$so" | awk '{print $NF}' | sort > /tmp/exported.txt
          printf 'vef_register\nvef_unregister\n' | sort > /tmp/expected.txt
          diff /tmp/expected.txt /tmp/exported.txt
